<div class="dashboard">
    <h2>POS Dashboard</h2>
  
    <!-- Statistics Cards -->
    <div class="stats">
      <div class="card">
        <h3>Total Sales</h3>
        <p>{{ totalSales | currency }}</p>
      </div>
      <div class="card">
        <h3>Orders</h3>
        <p>{{ totalOrders }}</p>
      </div>
      <div class="card">
        <h3>Products</h3>
        <p>{{ totalProducts }}</p>
      </div>
    </div>
  
    <!-- Recent Transactions -->
    <div class="transactions">
        <h3>Recent Transactions</h3>
        <table>
          <thead>
            <tr>
              <th>Customer</th>
              <th>Amount</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody> <!-- ✅ Add tbody here -->
            <tr *ngFor="let transaction of transactions">
              <td>{{ transaction.customer }}</td>
              <td>{{ transaction.amount | currency }}</td>
              <td>{{ transaction.date | date }}</td>
            </tr>
          </tbody>
        </table>
      </div>
      
  
    <!-- Quick Actions -->
    <div class="actions">
      <button (click)="newSale()">New Sale</button>
      <button (click)="manageProducts()">Manage Products</button>
      <button (click)="viewReports()">View Reports</button>
    </div>
  </div>
